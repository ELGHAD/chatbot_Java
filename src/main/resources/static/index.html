<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Java + Spring Boot Chatbot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            background: #0f172a;
            color: #e5e7eb;
        }

        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .chat-container {
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 16px;
            background: #020617;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
            overflow-y: auto;
            max-height: 400px;
        }

        .message {
            padding: 8px 12px;
            border-radius: 999px;
            max-width: 80%;
            font-size: 0.95rem;
        }

        .user {
            align-self: flex-end;
            background: #3b82f6;
            color: white;
        }

        .bot {
            align-self: flex-start;
            background: #111827;
            border: 1px solid #1f2937;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        textarea {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #4b5563;
            resize: vertical;
            min-height: 60px;
            max-height: 140px;
            background: #020617;
            color: #e5e7eb;
        }

        button {
            padding: 0 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            background: #3b82f6;
            color: white;
            transition: transform 0.05s ease, opacity 0.1s ease;
        }

        button:active {
            transform: scale(0.97);
            opacity: 0.9;
        }
    </style>
</head>
<body>
<h1>Spring Boot Chatbot</h1>

<div class="chat-container" id="chat">
    <!-- Messages will appear here -->
</div>

<div class="input-row">
    <textarea id="message" placeholder="Type a message (Enter to send, Shift+Enter for newline)..."></textarea>
    <button id="sendBtn">Send</button>
</div>

<script>
    const chat = document.getElementById("chat");
    const textarea = document.getElementById("message");
    const sendBtn = document.getElementById("sendBtn");

    function addMessage(text, type) {
        const div = document.createElement("div");
        div.classList.add("message", type);
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
        const message = textarea.value.trim();
        if (!message) return;

        // show user message
        addMessage(message, "user");
        textarea.value = "";

        try {
            const res = await fetch("/api/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ message })
            });

            if (!res.ok) {
                addMessage("Error from server 😢", "bot");
                return;
            }

            const data = await res.json();
            addMessage(data.reply, "bot");
        } catch (err) {
            console.error(err);
            addMessage("Network error 😢", "bot");
        }
    }

    sendBtn.addEventListener("click", sendMessage);

    // Enter to send, Shift+Enter for new line
    textarea.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
</script>
</body>
</html>
